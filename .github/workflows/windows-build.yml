name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and package
        shell: pwsh
        run: .\build.ps1 -Version 0.1.0-alpha.1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CodexUsageMonitor-win-x64
          path: |
            artifacts/CodexUsageMonitor-0.1.0-alpha.1-win-x64.zip*
            artifacts/release/*
          if-no-files-found: error
